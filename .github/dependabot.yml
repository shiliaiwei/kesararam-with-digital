version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    target-branch: "docs"
    labels:
      - "dependencies"
      - "security"
      - "automerge"
    # Consolidate all dependency updates into a single PR
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    target-branch: "docs"
    labels:
      - "github-actions"
      - "security"
    # Group CodeQL actions atomically and all others together
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
      all-actions:
        patterns:
          - "*"
