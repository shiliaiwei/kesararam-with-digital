version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    target-branch: "docs"
    labels:
      - "dependencies"
      - "security"
      - "automerge"
    # Consolidate all dependency updates into a single PR
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "googleapis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    target-branch: "docs"
    labels:
      - "github-actions"
      - "security"
    # Group all GitHub Actions together to prevent version mismatches (e.g. CodeQL steps)
    groups:
      all-actions:
        patterns:
          - "*"
