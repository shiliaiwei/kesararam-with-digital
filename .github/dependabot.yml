version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 15
    target-branch: "docs"
    labels:
      - "dependencies"
      - "security"
      - "automerge"
    # Group related packages to reduce PR noise and streamline patch merges
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      security-critical:
        patterns:
          - "next"
          - "nanoid"
          - "brace-expansion"
          - "ip-address"
          - "js-yaml"
          - "fast-uri"
          - "postcss"
          - "esbuild"
      hono-packages:
        patterns:
          - "hono"
          - "@hono/*"
      vitest-packages:
        patterns:
          - "vitest"
          - "@vitest/*"
      next-ecosystem:
        patterns:
          - "next-intl"
          - "next-themes"
          - "next-cloudinary"
      drizzle-packages:
        patterns:
          - "drizzle-*"
      eslint-packages:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
      types-packages:
        patterns:
          - "@types/*"
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
