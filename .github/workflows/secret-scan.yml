name: Secret Scanning

on:
  push:
    branches: [main, docs, develop]
  pull_request:
    branches: [main, docs, develop]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for Exposed Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Check that no .env files (other than .env.example) are committed
      - name: Check for committed .env files
        run: |
          echo "Checking for committed .env files..."
          # Find any .env files tracked by git (excluding .env.example)
          ENV_FILES=$(git ls-files | grep -E "^\.env" | grep -v "\.env\.example" || true)
          if [ -n "$ENV_FILES" ]; then
            echo "❌ Committed .env file(s) found:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "✅ No committed .env files found."

      # Check source files for hardcoded secrets patterns
      - name: Check for hardcoded secrets in source
        run: |
          echo "Scanning source files for hardcoded secrets..."
          FAILED=0

          # Only scan src/ and scripts/ — skip node_modules, .next, docs, etc.
          SCAN_DIRS="src scripts"

          for DIR in $SCAN_DIRS; do
            if [ ! -d "$DIR" ]; then continue; fi

            # Postgres connection strings with real passwords (not placeholders)
            if grep -rE "postgresql://[^:]+:[^@]{8,}@[^/]+" "$DIR" \
                --include="*.ts" --include="*.tsx" --include="*.js" \
                --exclude-dir=node_modules 2>/dev/null | \
                grep -v "your-password\|placeholder\|example\|test:test"; then
              echo "❌ Possible database URL with credentials in $DIR"
              FAILED=1
            fi

            # Hardcoded JWT secrets (long hex strings assigned to JWT_SECRET)
            if grep -rE "JWT_SECRET\s*=\s*['\"][a-f0-9]{40,}" "$DIR" \
                --include="*.ts" --include="*.tsx" --include="*.js" \
                --exclude-dir=node_modules 2>/dev/null; then
              echo "❌ Possible hardcoded JWT secret in $DIR"
              FAILED=1
            fi

            # Private keys
            if grep -rE "\-\-\-\-\-BEGIN (RSA |EC )?PRIVATE KEY\-\-\-\-\-" "$DIR" \
                --include="*.ts" --include="*.tsx" --include="*.js" \
                --exclude-dir=node_modules 2>/dev/null; then
              echo "❌ Private key found in $DIR"
              FAILED=1
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "⚠️  Secrets detected in source files. Move them to environment variables."
            exit 1
          fi

          echo "✅ No hardcoded secrets found in source files."
