name: Secret Scanning

on:
  push:
    branches: [main, docs, develop]
  pull_request:
    branches: [main, docs, develop]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Scan for Exposed Secrets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          # Scan entire repository
          path: ./
          # Scan from base branch to current
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          # Output format
          extra_args: --only-verified --json

      - name: Run custom secret check
        run: |
          chmod +x scripts/check-secrets.sh
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} | while read file; do
            if [ -f "$file" ]; then
              git show ${{ github.sha }}:"$file" | grep -E "(AIzaSy|sk-[0-9A-Za-z]{48}|postgres://|JWT_SECRET|API_KEY|API_SECRET)" && echo "⚠️ Potential secret in $file" && exit 1 || true
            fi
          done

      - name: Check for .env files
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E "\.env(\.|$)" | grep -v ".env.example"; then
            echo "❌ .env file detected in commit!"
            exit 1
          fi
