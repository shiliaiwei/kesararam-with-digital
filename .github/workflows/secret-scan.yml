name: Secret Scanning

on:
  push:
    branches: [main, docs]
  pull_request:
    branches: [main, docs]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan for Exposed Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Check for committed .env files
        run: |
          ENV_FILES=$(git ls-files | grep -E "^\.env" | grep -v "\.env\.example" || true)
          if [ -n "$ENV_FILES" ]; then
            echo "[FAIL] Committed .env file(s) found: $ENV_FILES"
            exit 1
          fi
          echo "[PASS] No committed .env files."

      - name: Check for hardcoded secrets in src/
        run: |
          FAILED=0
          if grep -rE "postgresql://[^:]+:[^@]{8,}@" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "placeholder\|example\|test:test"; then
            echo "[FAIL] Database URL with credentials found in src/"
            FAILED=1
          fi
          if grep -rE "-----BEGIN (RSA |EC )?PRIVATE KEY-----" src/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "[FAIL] Private key found in src/"
            FAILED=1
          fi
          [ $FAILED -eq 0 ] && echo "[PASS] No hardcoded secrets in src/"
          exit $FAILED
